services:
  mysql:
    image: mysql:8.0
    container_name: golf-store-mono-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: golf_store_mono
      MYSQL_USER: golf
      MYSQL_PASSWORD: golf
    ports:
      - "3307:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mono_mysql_data:/var/lib/mysql

volumes:
  mono_mysql_data:
