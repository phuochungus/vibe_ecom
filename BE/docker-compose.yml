version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: golf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: golf_store
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: golf-redis
    ports:
      - "6379:6379"
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: golf-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  kafka:
    image: bitnami/kafka:3.7
    container_name: golf-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    networks:
      - backend

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: api-gateway
    container_name: golf-api-gateway
    environment:
      SERVICE_NAME: api-gateway
      HTTP_PORT: "8080"
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MYSQL_DSN: root:root@tcp(mysql:3306)/gateway_db?parseTime=true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - backend

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: user-service
    container_name: golf-user-service
    environment:
      SERVICE_NAME: user-service
      HTTP_PORT: "8081"
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MYSQL_DSN: root:root@tcp(mysql:3306)/user_db?parseTime=true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

  product-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: product-service
    container_name: golf-product-service
    environment:
      SERVICE_NAME: product-service
      HTTP_PORT: "8082"
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MYSQL_DSN: root:root@tcp(mysql:3306)/product_db?parseTime=true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: order-service
    container_name: golf-order-service
    environment:
      SERVICE_NAME: order-service
      HTTP_PORT: "8083"
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MYSQL_DSN: root:root@tcp(mysql:3306)/order_db?parseTime=true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

  payment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: payment-service
    container_name: golf-payment-service
    environment:
      SERVICE_NAME: payment-service
      HTTP_PORT: "8084"
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MYSQL_DSN: root:root@tcp(mysql:3306)/payment_db?parseTime=true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: notification-service
    container_name: golf-notification-service
    environment:
      SERVICE_NAME: notification-service
      HTTP_PORT: "8085"
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MYSQL_DSN: root:root@tcp(mysql:3306)/notification_db?parseTime=true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
