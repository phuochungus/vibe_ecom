services:
  - type: web
    name: phuochungus-golf-store-api
    runtime: go
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: cd BE_mono && go build -o bin/api ./cmd/api
    startCommand: cd BE_mono && ./bin/api
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: POSTGRES_DSN
        fromDatabase:
          name: phuochungus-golf-store-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://phuochungus-golf-store-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://phuochungus-golf-store-admin.onrender.com,https://phuochungus-golf-store-customer.onrender.com
      - key: JWT_ISSUER
        value: be-mono
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_TTL_MINUTES
        value: "15"
      - key: JWT_REFRESH_TTL_MINUTES
        value: "10080"
    buildFilter:
      paths:
        - BE_mono/**
        - docs/**
        - render.yaml

  - type: web
    name: phuochungus-golf-store-admin
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd FE_admin && npm ci && npm run build
    staticPublishPath: FE_admin/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://phuochungus-golf-store-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - FE_admin/**
        - render.yaml

  - type: web
    name: phuochungus-golf-store-customer
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd FE_customer && npm ci && npm run build
    staticPublishPath: FE_customer/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://phuochungus-golf-store-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - FE_customer/**
        - render.yaml

databases:
  - name: phuochungus-golf-store-db
    plan: free
    region: singapore
    databaseName: golf_store_mono
    postgresMajorVersion: "16"
