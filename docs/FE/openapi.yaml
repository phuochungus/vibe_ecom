openapi: 3.0.3
info:
  title: Golf Store API Gateway
  version: 1.0.0
  description: API contract for FE integration via single API Gateway.
servers:
  - url: /api/v1
    description: API Gateway v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Profile
  - name: Products
  - name: Orders
  - name: Payments
  - name: Notifications
  - name: AdminProducts
  - name: AdminOrders
  - name: AdminRevenue
  - name: Webhooks
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '423':
          $ref: '#/components/responses/AccountLockedError'

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refresh success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '204':
          description: Logout success
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /me:
    get:
      tags: [Profile]
      summary: Current user profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /products:
    get:
      tags: [Products]
      security: []
      summary: List products
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/ProductStatus'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListEnvelope'

  /products/{product_id}:
    get:
      tags: [Products]
      security: []
      summary: Product detail
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /orders:
    post:
      tags: [Orders]
      summary: Create order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/OutOfStockError'
    get:
      tags: [Orders]
      summary: List my orders
      parameters:
        - $ref: '#/components/parameters/OrderStatus'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /orders/{order_id}:
    get:
      tags: [Orders]
      summary: Order detail
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /orders/{order_id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/OrderCannotCancelError'

  /orders/{order_id}/tracking:
    get:
      tags: [Orders]
      summary: Order tracking timeline
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Tracking data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTrackingEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /orders/{order_id}/payments:
    post:
      tags: [Payments]
      summary: Create payment for order
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/PaymentDuplicateError'
    get:
      tags: [Payments]
      summary: List payments by order
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Payment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      parameters:
        - $ref: '#/components/parameters/NotificationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/{notification_id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - $ref: '#/components/parameters/NotificationIdPath'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAllNotificationsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/products:
    post:
      tags: [AdminProducts]
      summary: Create product (admin)
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/products/{product_id}:
    patch:
      tags: [AdminProducts]
      summary: Update product (admin)
      x-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [AdminProducts]
      summary: Delete product (soft delete)
      x-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '204':
          description: Product deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/orders:
    get:
      tags: [AdminOrders]
      summary: List orders (admin)
      x-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/OrderStatus'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/orders/{order_id}:
    get:
      tags: [AdminOrders]
      summary: Order detail (admin)
      x-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/orders/{order_id}/status:
    patch:
      tags: [AdminOrders]
      summary: Update order status (admin)
      x-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateOrderStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /admin/revenue/summary:
    get:
      tags: [AdminRevenue]
      summary: Revenue summary
      x-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: group_by
          in: query
          required: false
          schema:
            type: string
            enum: [day, month, year]
      responses:
        '200':
          description: Revenue summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSummaryEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/revenue/orders:
    get:
      tags: [AdminRevenue]
      summary: Revenue orders breakdown
      x-required-role: ADMIN
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Revenue orders list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueOrdersEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      security: []
      summary: Payment webhook entrypoint
      description: External provider calls this endpoint via API Gateway.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Accepted for async processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductIdPath:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderIdPath:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationIdPath:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    Q:
      name: q
      in: query
      required: false
      schema:
        type: string
    ProductStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ProductStatus'
    MinPrice:
      name: min_price
      in: query
      required: false
      schema:
        type: string
    MaxPrice:
      name: max_price
      in: query
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created_at, price, name]
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
    OrderStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrderStatus'
    NotificationStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/NotificationStatus'
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountLockedError:
      description: Account locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OutOfStockError:
      description: Product out of stock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaymentDuplicateError:
      description: Duplicate payment request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OrderCannotCancelError:
      description: Order cannot be canceled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    EnvelopeBase:
      type: object
      required: [success, request_id, timestamp]
      properties:
        success:
          type: boolean
          example: true
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        meta:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            success:
              type: boolean
              enum: [false]
            error:
              $ref: '#/components/schemas/ErrorObject'
          required: [error]

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    UserRole:
      type: string
      enum: [USER, ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED, DISABLED]

    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, DISCONTINUED]

    OrderStatus:
      type: string
      enum: [NEW, PENDING_PAYMENT, PAID, PROCESSING, SHIPPING, COMPLETED, CANCELLED]

    PaymentStatus:
      type: string
      enum: [UNPAID, PAID, FAILED, REFUNDED]

    PaymentTxnState:
      type: string
      enum: [PENDING, SUCCESS, FAILED, CANCELLED]

    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED]

    UserProfile:
      type: object
      required: [id, role, full_name, email, phone, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'

    AuthTokenData:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserProfile'

    LoginResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AuthTokenData'

    RefreshTokenResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [access_token, refresh_token, token_type, expires_in]
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
                token_type:
                  type: string
                expires_in:
                  type: integer

    UserProfileEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/UserProfile'

    Product:
      type: object
      required: [id, sku, name, price, stock, status]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: string
        stock:
          type: integer
        status:
          $ref: '#/components/schemas/ProductStatus'
        image_url:
          type: string
          format: uri
          nullable: true

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    ProductListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              required: [items, pagination]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                pagination:
                  $ref: '#/components/schemas/Pagination'

    ProductDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Product'

    ShippingAddressInput:
      type: object
      required: [recipient_name, recipient_phone, line1, city, country_code]
      properties:
        recipient_name:
          type: string
        recipient_phone:
          type: string
        line1:
          type: string
        line2:
          type: string
          nullable: true
        ward:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        city:
          type: string
        province:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        country_code:
          type: string

    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    CreateOrderRequest:
      type: object
      required: [items, shipping_address]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddressInput'
        customer_note:
          type: string
          nullable: true

    OrderSummary:
      type: object
      required:
        [id, order_code, order_status, payment_status, subtotal_amount, discount_amount, shipping_fee, total_amount, placed_at]
      properties:
        id:
          type: string
          format: uuid
        order_code:
          type: string
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        subtotal_amount:
          type: string
        discount_amount:
          type: string
        shipping_fee:
          type: string
        total_amount:
          type: string
        payment_due_at:
          type: string
          format: date-time
          nullable: true
        placed_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      required: [product_id, sku, name, unit_price, quantity, line_total]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        unit_price:
          type: string
        quantity:
          type: integer
